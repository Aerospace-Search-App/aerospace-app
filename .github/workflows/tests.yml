name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt

      - name: Testleri çalıştır
        run: python -m pytest -q
